<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Edge-to-edge white background. iOS adds its own corner radius; the white blends with the iOS frame. -->
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- Big bold gradient Bitcoin glyph filling most of the canvas -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, system-ui, sans-serif"
        font-weight="900" font-size="430" fill="url(#g)">₿</text>
  <!-- Subtle ascending trendline behind/under the glyph -->
  <path d="M70 410 L160 320 L240 370 L340 230 L450 280"
        stroke="url(#g)" stroke-width="22"
        fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>

